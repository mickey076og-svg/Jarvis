name: Build GHOST JARVIS APK AUTO
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - uses: android-actions/setup-android@v3

      - name: AUTO-CREATE ALL JARVIS FILES
        run: |
          mkdir -p app/src/main/java/com/ghostjarvis/ai
          mkdir -p gradle/wrapper
          
          echo "include ':app'" > settings.gradle
          
          cat > build.gradle <<'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.0' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.ghostjarvis.ai'
              compileSdk 34
              defaultConfig {
                  applicationId "com.ghostjarvis.ai"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0-JARVIS-ONLINE"
              }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
          EOF
          
          cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.0-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.CALL_PHONE"/>
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"/>
              <application android:allowBackup="true" android:label="GHOST JARVIS" android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          
          cat > app/src/main/java/com/ghostjarvis/ai/JarvisBrain.java <<'EOF'
          package com.ghostjarvis.ai;
          import java.io.*; import java.net.*;
          public class JarvisBrain {
              public static String askGroq(String apiKey, String question){
                  if(apiKey==null || apiKey.isEmpty()) return "Add Groq API key";
                  try{
                      URL url=new URL("https://api.groq.com/openai/v1/chat/completions");
                      HttpURLConnection conn=(HttpURLConnection)url.openConnection();
                      conn.setRequestMethod("POST");
                      conn.setRequestProperty("Authorization","Bearer "+apiKey);
                      conn.setRequestProperty("Content-Type","application/json");
                      conn.setDoOutput(true);
                      String json="{\"model\":\"llama3-8b-8192\",\"messages\":[{\"role\":\"system\",\"content\":\"You are GHOST JARVIS, helpful AI controlling Android. Answer short max 25 words, Italian accent.\"},{\"role\":\"user\",\"content\":\""+question.replace("\"","")+"\"}]}";
                      OutputStream os=conn.getOutputStream(); os.write(json.getBytes()); os.flush();
                      BufferedReader br=new BufferedReader(new InputStreamReader(conn.getInputStream()));
                      String line, resp=""; while((line=br.readLine())!=null) resp+=line;
                      int idx=resp.indexOf("\"content\":\"");
                      if(idx!=-1){ int start=idx+11; int end=resp.indexOf("\",", start); if(end==-1) end=resp.indexOf("\"", start); String content=resp.substring(start, end); return content.replace("\\n"," ").replace("\\\"","\""); }
                      return resp.substring(0,150);
                  }catch(Exception e){ return "Brain error: "+e.getMessage(); }
              }
          }
          EOF
          
          cat > app/src/main/java/com/ghostjarvis/ai/MainActivity.java <<'EOF'
          package com.ghostjarvis.ai;
          import android.content.Intent; import android.content.pm.ApplicationInfo; import android.content.pm.PackageManager; import android.media.AudioManager; import android.net.Uri; import android.os.Bundle; import android.provider.Settings; import android.speech.RecognizerIntent; import android.speech.tts.TextToSpeech; import android.widget.*; import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity {
              TextToSpeech tts; TextView log; EditText apiKeyInput;
              protected void onCreate(Bundle b){
                  super.onCreate(b);
                  LinearLayout lay=new LinearLayout(this); lay.setOrientation(LinearLayout.VERTICAL); lay.setPadding(40,60,40,40); lay.setBackgroundColor(0xFF0D1117);
                  TextView title=new TextView(this); title.setText("GHOST JARVIS\nONLINE AI\nControls Any Device"); title.setTextSize(26); title.setTextColor(0xFF00FF88); title.setGravity(1); lay.addView(title);
                  apiKeyInput=new EditText(this); apiKeyInput.setHint("Paste Groq Key (free) for AI brain - optional"); apiKeyInput.setBackgroundColor(0xFFFFFFFF); lay.addView(apiKeyInput);
                  log=new TextView(this); log.setText("Ready!\nCommands:\n• Open YouTube / WhatsApp / TikTok\n• Volume up/down\n• Call number\n• Search anything\n• Open Ghost Football"); log.setTextColor(0xFFFFFFFF); log.setPadding(0,20,0,20); lay.addView(log);
                  Button btn=new Button(this); btn.setText("TAP TO SPEAK TO JARVIS"); btn.setTextSize(20); lay.addView(btn);
                  setContentView(lay);
                  tts=new TextToSpeech(this,s->{ if(s==TextToSpeech.SUCCESS){ tts.setLanguage(new java.util.Locale("it","IT")); tts.setSpeechRate(1.1f); speak("Ciao boss! Sono Ghost Jarvis online!"); }});
                  btn.setOnClickListener(v->{
                      Intent i=new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH); i.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM); i.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "en-US");
                      try{ startActivityForResult(i,100); log.setText("Listening..."); }catch(Exception e){ log.setText("No speech"); }
                  });
              }
              protected void onActivityResult(int req,int res, Intent data){
                  super.onActivityResult(req,res,data);
                  if(req==100 && res==RESULT_OK){ String cmd=data.getStringArrayListExtra(RecognizerIntent.EXTRA_RESULTS).get(0); log.setText("You: "+cmd); handle(cmd.toLowerCase()); }
              }
              void handle(String c){
                  try{
                      if(c.contains("youtube")) open("youtube","https://youtube.com","YouTube");
                      else if(c.contains("whatsapp")) open("whatsapp","https://whatsapp.com","WhatsApp");
                      else if(c.contains("tiktok")) open("tiktok","https://tiktok.com","TikTok");
                      else if(c.contains("ghost")){ Intent in=getPackageManager().getLaunchIntentForPackage("com.ghostfootball.game"); if(in!=null) startActivity(in); else open("ghost","https://github.com","Ghost Football"); speak("Launching Ghost Football! GOOOOL!"); }
                      else if(c.contains("open")){ String app=c.replace("open","").trim(); if(!openByName(app)) search(c); }
                      else if(c.contains("volume up")){ AudioManager am=(AudioManager)getSystemService(AUDIO_SERVICE); am.adjustVolume(AudioManager.ADJUST_RAISE,1); speak("Volume up"); }
                      else if(c.contains("volume down")){ AudioManager am=(AudioManager)getSystemService(AUDIO_SERVICE); am.adjustVolume(AudioManager.ADJUST_LOWER,1); speak("Volume down"); }
                      else if(c.contains("call")){ String num=c.replaceAll("[^0-9+]",""); if(num.length()>=7) startActivity(new Intent(Intent.ACTION_CALL, Uri.parse("tel:"+num))); }
                      else search(c);
                  }catch(Exception e){ log.setText("Error "+e.getMessage()); }
              }
              boolean openByName(String name){ PackageManager pm=getPackageManager(); for(ApplicationInfo ai: pm.getInstalledApplications(0)){ String label=ai.loadLabel(pm).toString().toLowerCase(); if(label.contains(name)){ Intent i=pm.getLaunchIntentForPackage(ai.packageName); if(i!=null){ startActivity(i); speak("Opening "+label); return true; } } } return false; }
              void open(String k,String web,String sName){ if(openByName(k)) return; startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(web))); speak("Opening "+sName+" online"); }
              void search(String q){ speak("Searching "+q); if(!apiKeyInput.getText().toString().isEmpty()){ new Thread(()->{ String ans=JarvisBrain.askGroq(apiKeyInput.getText().toString().trim(), q); runOnUiThread(()->{ log.setText("AI: "+ans); speak(ans); }); }).start(); } else { startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse("https://www.google.com/search?q="+Uri.encode(q)))); } }
              void speak(String t){ if(tts!=null) tts.speak(t, TextToSpeech.QUEUE_FLUSH, null, null); }
          }
          EOF

      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.0
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GHOST-JARVIS-ONLINE-APK
          path: app/build/outputs/apk/debug/*.apk
